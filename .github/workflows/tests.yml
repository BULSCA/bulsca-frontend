name: Frontend tests

on:
  push:
    branches: ['CODEX/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:run
      - name: Check application, tests and tooling types without emitting output
        run: |
          node_modules/.bin/vue-tsc --noEmit -p tsconfig.app.json
          node_modules/.bin/vue-tsc --noEmit -p tsconfig.vitest.json
          node_modules/.bin/vue-tsc --noEmit -p tsconfig.node.json
      - run: npm run lint:check
